project_name: "YOLOv5 physical adversarial patch generation"
research_area: "Computer vision; object detection; physical adversarial attacks"
research_question: "How effectively do learned physical adversarial patches suppress four-class vehicle detection on VisDrone, and how do patch transformations and cross-model transfer affect attack success?"
current_stage: "experiments"
last_updated: "2026-08-25"

main_entrypoints:
  - path: "train_patch.py"
    purpose: "Train a differentiable adversarial patch from a JSON experiment configuration."
  - path: "test_patch.py"
    purpose: "Evaluate clean, random-patch, and learned-patch detection results on an image directory."
  - path: "run_patch_experiment.sh"
    purpose: "Reproducible wrapper for seeded patch training, epoch evaluation, logs, and metadata."
  - path: "compare_results_filtered.py"
    purpose: "Aggregate patch evaluation statistics into CSV summaries and plots."
  - path: "compare_transfer_results.py"
    purpose: "Aggregate zero-shot transfer results from YOLOv5 patches to Faster R-CNN."
  - path: "adv_patch_gen/conv_visdrone_2_yolo/conv_visdrone_2_yolo_fmt.py"
    purpose: "Convert VisDrone annotations into YOLO-format labels."
  - path: "experiments/vehicle4_v2/run_remaining_pipeline.py"
    purpose: "Monitor detector training and run dependent Vehicle4 v2 patch, rendering, evaluation, and aggregation stages."

datasets:
  - "visdrone_train"
  - "visdrone_val"
  - "vehicle_detector_checkpoints"
  - "visdrone_vehicle4_v2"

evidence_artifacts:
  - path: "analysis/full_3seeds/results_summary.csv"
    purpose: "Three-seed full-augmentation ablation metrics at epoch 10."
  - path: "analysis/no_gaussian_3seeds/results_summary.csv"
    purpose: "Three-seed ablation with multiplicative/additive Gaussian patch noise disabled."
  - path: "analysis/no_location_3seeds/results_summary.csv"
    purpose: "Three-seed ablation with random patch location disabled."
  - path: "analysis/no_rotate_3seeds/results_summary.csv"
    purpose: "Three-seed ablation with patch rotation disabled."
  - path: "analysis/no_transform_3seeds/results_summary.csv"
    purpose: "Three-seed ablation with patch transforms disabled."
  - path: "analysis/fasterrcnn_transfer_3seeds/results_summary.csv"
    purpose: "Three-seed YOLOv5-to-Faster-R-CNN transfer metrics."
  - path: "analysis/transformer_ablation/results_summary.csv"
    purpose: "Earlier single-seed ablation summary retained for comparison."
  - path: "runs/train_adversarial/"
    purpose: "Patch training configurations, TensorBoard event files, and generated patches."
  - path: "runs/test_adversarial/"
    purpose: "Clean/random/adversarial detection statistics and per-image evaluation outputs."
  - path: "transfer_models/faster_rcnn/results/"
    purpose: "Faster R-CNN transfer summaries and per-image results."
  - path: "experiment_data/vehicle4_v2/runs/"
    purpose: "Canonical physical storage for Vehicle4 v2 provenance, checkpoints, patches, rendered inputs, predictions, and pipeline state; runs/vehicle4_v2 is a compatibility symlink."
  - path: "experiment_data/vehicle4_v2/analysis/"
    purpose: "Canonical physical storage for the queued three-model paired transfer summary; analysis/vehicle4_v2_transfer is a compatibility symlink."
  - path: "experiment_data/vehicle4_v2/analysis/attackability/"
    purpose: "Object-level and six-dimension stratification of learned/random ASR by class, size, bbox area, clean confidence, image density, and class-size interaction."
